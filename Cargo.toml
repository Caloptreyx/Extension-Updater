[package]
name = "dev_caloptreyx_updater"
description = "Keeps Caloptreyx extensions up to date: shows their new releases in the admin area and installs them, several in one rebuild."
authors = ["Caloptreyx"]
version = "0.1.0"
edition = { workspace = true }

[dependencies]
shared = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
compact_str = { workspace = true }
futures-util = { workspace = true }
hex = { workspace = true }
reqwest = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
utoipa-axum = { workspace = true }
uuid = { workspace = true }
# Metadata.toml of release tags, the same version the panel's own `shared` crate uses
toml = "1.0.1"
